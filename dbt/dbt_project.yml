name: retail
version: "1.0.0"
config-version: 2

profile: retail

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  retail:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Ephemeral: these exist to name a concept, not to be queried directly.
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

vars:
  # The dataset's own span. Hardcoding it keeps dim_date stable rather than
  # having the calendar silently change shape when the data is reloaded.
  date_start: "2009-12-01"
  date_end: "2011-12-31"

  # Stock codes that are not products: postage, bank charges, manual
  # adjustments, test rows. Excluding them is the difference between
  # "revenue" and "money that moved".
  non_product_codes: ["POST", "D", "DOT", "M", "S", "AMAZONFEE", "BANK CHARGES",
                      "C2", "CRUK", "PADS", "B", "TEST001", "TEST002", "ADJUST", "ADJUST2"]
